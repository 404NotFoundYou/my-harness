name: AI Harness

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      base:
        description: Full base commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Runtime tests
        run: node .ai-harness/tests/run.mjs
      - name: Runtime health
        run: node .ai-harness/bin/harness.mjs doctor --json
      - name: Workflow gates
        env:
          HARNESS_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
          HARNESS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$HARNESS_BASE" =~ ^0+$ ]]; then
            HARNESS_BASE=$(git merge-base HEAD "refs/remotes/origin/$HARNESS_DEFAULT_BRANCH")
          fi
          node .ai-harness/bin/harness.mjs check --ci --base "$HARNESS_BASE" --json
