name: Harness source tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "20"
          - os: ubuntu-latest
            node-version: "22"
          - os: ubuntu-latest
            node-version: "24"
          - os: windows-latest
            node-version: "20"
          - os: windows-latest
            node-version: "22"
          - os: windows-latest
            node-version: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Benchmark framework tests (no model calls)
        run: node benchmarks/tests/run.mjs
      - name: Windows runtime compatibility
        if: runner.os == 'Windows'
        run: node .ai-harness/tests/run.mjs
