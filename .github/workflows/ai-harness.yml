name: AI Harness

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Runtime tests
        run: node .ai-harness/tests/run.mjs
      - name: Runtime health
        run: node .ai-harness/bin/harness.mjs doctor --json
      - name: Workflow gates
        run: node .ai-harness/bin/harness.mjs check --ci --json
