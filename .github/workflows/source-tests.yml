name: Harness source tests

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node-version: "20"
          - os: ubuntu-latest
            node-version: "22"
          - os: ubuntu-latest
            node-version: "24"
          - os: windows-latest
            node-version: "20"
          - os: windows-latest
            node-version: "22"
          - os: windows-latest
            node-version: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Benchmark framework tests (no model calls)
        run: node benchmarks/tests/run.mjs
      - name: Installed runtime tests
        run: node benchmarks/tests/installed-runtime.mjs
